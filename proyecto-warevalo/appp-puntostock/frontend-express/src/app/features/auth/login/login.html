<div class="flex min-h-dvh items-center justify-center bg-slate-100 px-4 py-10">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
    <div class="mb-8 text-center">
      <div
        class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-600 text-white"
      >
        <i class="pi pi-box text-2xl"></i>
      </div>

      <h1 class="text-2xl font-bold text-slate-900">PuntoStock Express</h1>
      <p class="mt-2 text-sm text-slate-500">Inicia sesión para acceder al sistema</p>
    </div>

    <form class="space-y-5" (ngSubmit)="submit()">
      <div>
        <label for="identifier" class="mb-2 block text-sm font-medium text-slate-700">
          Usuario o correo electrónico
        </label>
        <input
          id="identifier"
          name="identifier"
          type="text"
          [(ngModel)]="identifier"
          autocomplete="username"
          required
          class="w-full rounded-lg border border-slate-300 px-3 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          placeholder="Ingresa tu usuario o correo"
        />
      </div>

      <div>
        <label for="password" class="mb-2 block text-sm font-medium text-slate-700">
          Contraseña
        </label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
          class="w-full rounded-lg border border-slate-300 px-3 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          placeholder="Ingresa tu contraseña"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>
</div>
