<div class="login-background flex min-h-dvh items-center justify-center px-4 py-10">
  <div class="login-overlay"></div>

  <div class="login-card relative z-10 w-full max-w-md rounded-3xl p-8 sm:p-10">
    <div class="mb-8 text-center">
      <img
        src="/images/puntostock-logo.png"
        alt="Logo PuntoStock Express"
        class="mx-auto mb-6 h-28 w-full object-contain"
      />

      <h1 class="text-2xl font-bold text-slate-900">Bienvenido</h1>
      <p class="mt-2 text-sm text-slate-500">
        Inicia sesión para acceder a PuntoStock Express
      </p>
    </div>

    <form class="space-y-5" (ngSubmit)="submit()">
      <div>
        <label for="identifier" class="mb-2 block text-sm font-semibold text-slate-700">
          Usuario o correo electrónico
        </label>
        <input
          id="identifier"
          name="identifier"
          type="text"
          [(ngModel)]="identifier"
          autocomplete="username"
          required
          class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          placeholder="Ingresa tu usuario o correo"
        />
      </div>

      <div>
        <label for="password" class="mb-2 block text-sm font-semibold text-slate-700">
          Contraseña
        </label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
          class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          placeholder="Ingresa tu contraseña"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-xl bg-blue-700 px-4 py-3.5 text-sm font-bold text-white shadow-lg shadow-blue-900/20 transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ loading() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="mt-7 text-center text-xs text-slate-400">
      PuntoStock Express · Gestión comercial e inventario
    </p>
  </div>
</div>
