<section class="p-4">
  <div class="mb-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold">Detalles de ventas</h1>
    <button
      type="button"
      class="rounded bg-blue-600 px-4 py-2 text-white hover:bg-blue-700"
      (click)="loadProductSales()"
    >
      Actualizar
    </button>
  </div>

  @if (errorMessage) {
    <p class="mb-3 text-red-600">{{ errorMessage }}</p>
  }

  <p-table
    [value]="productSales"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [tableStyle]="{ 'min-width': '40rem' }"
  >
    <ng-template #header>
      <tr>
        <th>ID</th>
        <th>Venta</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Estado</th>
      </tr>
    </ng-template>

    <ng-template #body let-item>
      <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.sale_id }}</td>
        <td>{{ item.product_id }}</td>
        <td>{{ item.quantity }}</td>
        <td>
          <p-tag
            [value]="item.status ?? 'Sin estado'"
            [severity]="item.status === 'active' ? 'success' : 'secondary'"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5">No hay detalles de ventas para mostrar.</td>
      </tr>
    </ng-template>
  </p-table>
</section>
