<p-card>
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <h2 class="text-xl font-semibold">
      {{ line() ? 'Editar línea de venta' : 'Agregar línea de venta' }}
    </h2>

    <div class="flex flex-col gap-2">
      <label for="sale">Venta</label>
      <p-select
        inputId="sale"
        formControlName="sale_id"
        [options]="sales()"
        optionLabel="id"
        optionValue="id"
        placeholder="Selecciona una venta"
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="product">Producto</label>
      <p-select
        inputId="product"
        formControlName="product_id"
        [options]="products()"
        optionLabel="name"
        optionValue="id"
        placeholder="Selecciona un producto"
        [filter]="true"
        filterBy="name"
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="quantity">Cantidad</label>
      <p-inputnumber
        inputId="quantity"
        formControlName="quantity"
        [min]="1"
        [showButtons]="true"
        class="w-full"
      />
    </div>

    @if (!line()) {
      <div class="flex flex-col gap-2">
        <label for="status">Estado</label>
        <p-select
          inputId="status"
          formControlName="status"
          [options]="[
            { label: 'Activa', value: 'active' },
            { label: 'Inactiva', value: 'inactive' }
          ]"
          optionLabel="label"
          optionValue="value"
          class="w-full"
        />
      </div>
    }

    <div class="flex flex-wrap gap-2">
      <p-button
        type="submit"
        [label]="line() ? 'Guardar cambios' : 'Crear línea'"
        icon="pi pi-check"
      />
      <p-button
        type="button"
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        (onClick)="cancelled.emit()"
      />
    </div>
  </form>
</p-card>
