<header
  class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-slate-200 bg-white px-4 sm:px-6"
>
  <button
    pButton
    type="button"
    text
    rounded
    aria-label="Mostrar u ocultar el menú"
    (click)="menuRequested.emit()"
  >
    <i class="pi pi-bars" aria-hidden="true"></i>
  </button>

  <div class="flex min-w-0 flex-1 items-center gap-3">
    <img
      src="/images/puntostock-logo.png"
      alt="PuntoStock"
      class="h-11 w-11 shrink-0 object-contain"
    />

    <div class="min-w-0">
      <p class="truncate text-sm font-bold text-slate-900">
        {{ appName() }}
      </p>

      <p class="truncate text-xs text-slate-500">
        Gestión de productos, compras, ventas e inventario
      </p>
    </div>
  </div>

  <button
    pButton
    type="button"
    severity="danger"
    outlined
    (click)="logoutRequested.emit()"
  >
    <i class="pi pi-sign-out mr-2" aria-hidden="true"></i>
    <span>Cerrar sesión</span>
  </button>
</header>
