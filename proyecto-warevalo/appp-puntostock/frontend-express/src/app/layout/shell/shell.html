<div class="app-shell flex min-h-dvh flex-col">
  <app-header
    [appName]="appName"
    (menuRequested)="toggleSidebar()"
    (logoutRequested)="logout()"
  />

  <div class="shell-body flex min-h-0 flex-1">
    <aside class="sidebar-container shrink-0">
      <app-aside
        [appName]="appName"
        [items]="menuItems()"
      />
    </aside>

    <main class="main-content min-w-0 flex-1">
      <div class="mx-auto w-full max-w-[1600px]">
        <router-outlet />
      </div>
    </main>
  </div>

  <app-footer />
</div>
