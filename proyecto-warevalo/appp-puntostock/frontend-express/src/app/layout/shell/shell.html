<div class="flex min-h-dvh flex-col bg-slate-50">
  <app-header
    [appName]="appName"
    (menuRequested)="toggleSidebar()"
  />

  <div class="flex flex-1">
    @if (sidebarVisible()) {
      <aside class="w-72 shrink-0">
        <app-aside
          [appName]="appName"
          [items]="menuItems"
          (navigated)="closeSidebar()"
        />
      </aside>
    }

    <main class="min-w-0 flex-1 p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>

  <app-footer />
</div>
