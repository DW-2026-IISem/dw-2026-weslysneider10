<div class="sidebar flex h-full flex-col">

  <button
    type="button"
    class="back-button"
    (click)="goBack()"
  >
    <i class="pi pi-arrow-left"></i>
    <span>Volver</span>
  </button>

  <div class="sidebar-navigation flex-1 overflow-y-auto">
    <p class="navigation-heading">MENÚ PRINCIPAL</p>

    <nav aria-label="Navegación principal">
      @for (section of items(); track section.label) {
        <div class="menu-section">

          <button
            type="button"
            class="section-toggle"
            [class.section-open]="isExpanded(section.label || '')"
            [attr.aria-expanded]="isExpanded(section.label || '')"
            (click)="toggleSection(section.label || '')"
          >
            <span class="section-name">
              {{ section.label }}
            </span>

            <i
              class="pi pi-chevron-down section-chevron"
              [class.chevron-open]="isExpanded(section.label || '')"
            ></i>
          </button>

          @if (isExpanded(section.label || '')) {
            <div class="section-items">
              @for (item of section.items || []; track item.label) {
                <a
                  class="menu-link"
                  [routerLink]="item.routerLink"
                  routerLinkActive="menu-link-active"
                  [routerLinkActiveOptions]="{ exact: true }"
                  (click)="onNavigation()"
                >
                  @if (item.icon) {
                    <i [class]="item.icon + ' menu-icon'"></i>
                  }

                  <span>{{ item.label }}</span>
                  @if (item.badge === 'lock') {
                    <i class="pi pi-lock ml-auto text-xs opacity-60"
                      title="Puedes ver esta sección, pero no tienes permiso sobre ella"></i>
                  }
                </a>
              }
            </div>
          }
        </div>
      }
    </nav>
  </div>

  <div class="sidebar-bottom">
    <div class="sidebar-status">
      <span class="status-dot"></span>
      <span>Sistema PuntoStock</span>
    </div>

    <p class="sidebar-version">
      Gestión comercial e inventario
    </p>
  </div>

</div>
